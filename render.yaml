services:
  - type: web
    name: backend
    plan: starter
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markaz-media-db 
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false 
      - key: CLAUDE_API_KEY
        sync: false 
      - key: RENDER_EXTERNAL_URL 
        fromService:
          type: web 
          name: frontend
          property: host

  - type: web
    name: frontend
    plan: starter
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL 
        fromService:
          type: web
          name: backend
          property: host