services:
  # خدمة الخادم الخلفي
  - type: web
    name: backend
    plan: starter
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-db-fresh
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # الواجهة الأمامية
  - type: web
    name: frontend
    plan: starter
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://backend-y4ir.onrender.com

  # خدمة Claude Proxy
  - type: web
    name: claude-proxy
    plan: starter
    env: docker
    dockerfilePath: ./claude-proxy/Dockerfile
    dockerContext: ./claude-proxy
    envVars:
      - key: CLAUDE_API_KEY
        sync: false

# خدمة infographic-converter
  - type: web
    name: infographic-converter
    plan: starter
    env: docker
    dockerfilePath: ./services/infographic-converter/Dockerfile
    dockerContext: ./services/infographic-converter
    envVars:
      - key: VITE_MAIN_BACKEND_URL
        value: https://backend-y4ir.onrender.com
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_PEXELS_API_KEY
        sync: false
      - key: VITE_UNSPLASH_ACCESS_KEY
        sync: false
      - key: VITE_CLAUDE_PROXY_URL
        value: https://claude-proxy-zjkv.onrender.com
      - key: VITE_FACEBOOK_PAGE_ID
        sync: false
      - key: VITE_FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: VITE_INSTAGRAM_USER_ID
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: VITE_TELEGRAM_BOT_TOKEN
        sync: false
      - key: VITE_TELEGRAM_CHAT_ID
        sync: false
      - key: VITE_N8N_LINKEDIN_WEBHOOK_URL
        sync: false 


