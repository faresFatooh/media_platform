services:
  # 1. الخادم الخلفي (Backend) - لا تغيير
  - type: web
    name: backend
    plan: starter
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-db-fresh 
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      # نستخدم الرابط النهائي والمباشر للواجهة الأمامية لضمان الاستقرار
      - key: RENDER_FRONTEND_URL
        value: https://ghazimortaja.com

  # 2. الواجهة الأمامية الرئيسية (Frontend) - لا تغيير
  - type: web
    name: frontend
    plan: starter
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # نستخدم الرابط النهائي والمباشر للخادم لضمان الاستقرار
      - key: NEXT_PUBLIC_API_URL
        value: https://backend.ghazimortaja.com
  
  # --- ✅ 3. خدمة مولد الأخبار الجديدة ---
  - type: web
    name: ai-news-generator-service
    plan: starter
    env: docker
    # تأكد من أن اسم المجلد صحيح
    dockerfilePath: ./services/ai-news-generator-service/Dockerfile
    dockerContext: ./services/ai-news-generator-service
    envVars:
      # يمرر رابط الخادم الخلفي للتطبيق الجديد
      - key: VITE_MAIN_BACKEND_URL 
        value: https://backend.ghazimortaja.com
      # يجب أن يبدأ بـ VITE_ ليعمل مع Vite
      - key: VITE_GEMINI_API_KEY
        sync: false # ستقوم بإضافته يدويًا