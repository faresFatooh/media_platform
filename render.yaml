services:
  # 1. الخادم الخلفي
  - type: web
    name: backend
    plan: starter
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-db-fresh 
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: RENDER_FRONTEND_URL
        value: https://ghazimortaja.com

  # 2. الواجهة الأمامية الرئيسية
  - type: web
    name: frontend
    plan: starter
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://backend.ghazimortaja.com
      - key: VITE_CLAUDE_PROXY_URL
        value: https://claude-proxy.onrender.com

  # 3. خدمة مولد الأخبار الجديدة
  - type: web
    name: ai-news-generator-service
    plan: starter
    env: docker
    dockerfilePath: ./services/ai-news-generator-service/Dockerfile
    dockerContext: ./services/ai-news-generator-service
    envVars:
      - key: VITE_MAIN_BACKEND_URL
        value: https://backend.ghazimortaja.com
        build: true
      - key: VITE_GEMINI_API_KEY
        sync: false
        build: true
      - key: VITE_CLAUDE_PROXY_URL
        value: https://claude-proxy.onrender.com
        build: true

  # 4. خدمة بروكسي Claude
  - type: web
    name: claude-proxy
    plan: starter
    env: docker
    dockerfilePath: ./claude-proxy/Dockerfile
    dockerContext: ./claude-proxy
    envVars:
      - key: CLAUDE_API_KEY
        sync: false
