services:
  - type: web
    name: backend
    plan: starter
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markaz-media-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      # RENDER_FRONTEND_URL لم نعد بحاجة إليه بنفس الطريقة، ولكن يمكننا تركه
      # إذا كان الكود يستخدمه لشيء آخر مثل CORS
      - key: RENDER_FRONTEND_URL 
        value: https://frontend-rgr7.onrender.com # يمكن تحديثه لاحقًا

  - type: web
    name: frontend
    plan: starter
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # --- ✅ التعديل الرئيسي هنا ---
      - key: NEXT_PUBLIC_API_URL
        value: https://backend-y4ir.onrender.com # استخدام الرابط العام والمباشر للخادم
      # --------------------------

  - type: web
    name: video-sync-service
    plan: starter
    env: docker
    dockerfilePath: ./services/video-synchronizer/Dockerfile
    dockerContext: ./services/video-synchronizer
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: news-refine-service
    plan: starter
    env: docker
    dockerfilePath: ./services/news-refine/Dockerfile
    dockerContext: ./services/news-refine
    envVars:
      - key: GEMINI_API_KEY
        sync: false
  
  - type: web
    name: avatar-service
    plan: starter
    env: docker
    dockerfilePath: ./services/dynamic-avatar/Dockerfile
    dockerContext: ./services/dynamic-avatar
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: chatbot-service
    plan: starter
    env: docker
    dockerfilePath: ./services/news-chatbot/Dockerfile
    dockerContext: ./services/news-chatbot
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: asharq-service
    plan: starter
    env: docker
    dockerfilePath: ./services/asharq-news/Dockerfile
    dockerContext: ./services/asharq-news
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: podcast-service
    plan: starter
    env: docker
    dockerfilePath: ./services/podcast-helper/Dockerfile
    dockerContext: ./services/podcast-helper
    envVars:
      - key: GEMINI_API_KEY
        sync: false
        
  - type: web
    name: style-editor-service
    plan: starter
    env: docker
    dockerfilePath: ./services/style-editor/Dockerfile
    dockerContext: ./services/style-editor
    envVars:
      # --- ✅ التعديل الرئيسي هنا ---
      - key: MAIN_BACKEND_URL
        value: https://backend-y4ir.onrender.com
      # --------------------------
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: infographic-service
    plan: starter
    env: docker
    dockerfilePath: ./services/infographic-converter/Dockerfile
    dockerContext: ./services/infographic-converter
    envVars:
      - key: GEMINI_API_KEY
        sync: false
  
  - type: web
    name: discovery-script-service
    plan: starter
    env: docker
    dockerfilePath: ./services/discovery-script-service/Dockerfile
    dockerContext: ./services/discovery-script-service
    envVars:
      # --- ✅ التعديل الرئيسي هنا ---
      - key: MAIN_BACKEND_URL
        value: https://backend-y4ir.onrender.com
      # --------------------------
      - key: GEMINI_API_KEY
        sync: false